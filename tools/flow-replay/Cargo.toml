version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "flow-replay"
path = "src/main.rs"

[dependencies]
tokio.workspace = true

[dev-dependencies]
tidegard-protocol-ipfix = { path = "../../crates/protocol-ipfix" }
