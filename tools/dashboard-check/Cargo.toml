[package]
name = "tidegard-dashboard-check"
description = "Static checks for the Grafana dashboards: every panel queries a metric or table that exists (ADR 0041)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1"
tidegard-storage = { path = "../../crates/storage" }

[dev-dependencies]
tidegard-collector = { path = "../../crates/collector" }
tidegard-incident-manager = { path = "../../crates/incident-manager" }
tidegard-notification = { path = "../../crates/notification" }
