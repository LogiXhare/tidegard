version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1"
wetechinetmon-storage = { path = "../../crates/storage" }

[dev-dependencies]
wetechinetmon-collector = { path = "../../crates/collector" }
wetechinetmon-incident-manager = { path = "../../crates/incident-manager" }
wetechinetmon-notification = { path = "../../crates/notification" }
