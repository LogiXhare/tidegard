# Loads the WetechiNetMon dashboards from a directory Grafana can read.
# Mount grafana/dashboards/ there, or copy the JSON files into it.
apiVersion: 1

providers:
  - name: wetechinetmon
    folder: WetechiNetMon
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/wetechinetmon
