# Tidegard reference stack (ADR 0052): PostgreSQL, ClickHouse and
# the five services on one host. Run ./setup.sh once, as root, before the
# first `docker compose up`: it makes the TLS certificates, the passwords
# and .env. See README.md.
#
# - Every connection between containers uses TLS, verified against the
#   stack's own CA. Nothing between them is plaintext.
# - Mitigation is dry-run with BGP off, and gobgpd is not part of the
#   stack: BGP runs from the tarball, beside gobgpd on loopback.
# - Only the API, the collector's UDP port and the metrics endpoints are
#   published, the metrics on loopback only.

name: tidegard

x-service: &service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    postgres:
      condition: service_healthy

x-tls: &tls
  type: bind
  source: ./tls/ca.pem
  target: /etc/tidegard/tls/ca.pem
  read_only: true

services:
  postgres:
    image: postgres:17.11-alpine3.23@sha256:9ea644da56f1a82283b173fa38a316636fe7c538991a8ae41998cd3765434991
    restart: unless-stopped
    environment:
      POSTGRES_USER: tidegard
      POSTGRES_DB: tidegard
      POSTGRES_PASSWORD_FILE: /run/tidegard/postgres-password
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/tidegard/tls/postgres.crt
      - -c
      - ssl_key_file=/etc/tidegard/tls/postgres.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./tls/postgres.crt:/etc/tidegard/tls/postgres.crt:ro
      - ./tls/postgres.key:/etc/tidegard/tls/postgres.key:ro
      - ./secrets/postgres-password:/run/tidegard/postgres-password:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tidegard", "-d", "tidegard"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.24.9@sha256:35b2bc23277259a249af5fbb199ca9ce5042eb249ecbbcbb15b19256a1f41660
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: tidegard
      CLICKHOUSE_PASSWORD_FILE: /run/tidegard/clickhouse-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse-tls.xml:/etc/clickhouse-server/config.d/tidegard-tls.xml:ro
      - ./tls/clickhouse.crt:/etc/tidegard/tls/clickhouse.crt:ro
      - ./tls/clickhouse.key:/etc/tidegard/tls/clickhouse.key:ro
      - ./secrets/clickhouse-password:/run/tidegard/clickhouse-password:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # Healthy once the HTTPS port accepts connections. The image has bash,
      # not curl; the services verify the certificate when they connect.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8443"]
      interval: 2s
      timeout: 5s
      retries: 60

  incident-manager:
    <<: *service
    image: ${TIDEGARD_IMAGE_PREFIX:-ghcr.io/logixhare/tidegard-}incident-manager:${TIDEGARD_VERSION:?set TIDEGARD_VERSION in .env}
    environment:
      TIDEGARD_INCIDENT_DATABASE_URL: ${TIDEGARD_DATABASE_URL:?run setup.sh first}
      TIDEGARD_INCIDENT_DATABASE_CA_FILE: /etc/tidegard/tls/ca.pem
    volumes:
      - *tls
    ports:
      - "127.0.0.1:9091:9091"

  collector:
    <<: *service
    image: ${TIDEGARD_IMAGE_PREFIX:-ghcr.io/logixhare/tidegard-}collector:${TIDEGARD_VERSION:?set TIDEGARD_VERSION in .env}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      TIDEGARD_COLLECTOR_LOCAL_PREFIXES: ${TIDEGARD_LOCAL_PREFIXES:-192.0.2.0/24@default}
      # Your routers (ADR 0056). Empty accepts any source, with a warning.
      TIDEGARD_COLLECTOR_ALLOWED_EXPORTERS: ${TIDEGARD_ALLOWED_EXPORTERS:-}
      TIDEGARD_COLLECTOR_DETECTION_POLICY_FILE: /etc/tidegard/detection-policy.json
      # Must equal every policy's "window".
      TIDEGARD_COLLECTOR_DETECTION_WINDOW_SECS: ${TIDEGARD_DETECTION_WINDOW_SECS:-5}
      TIDEGARD_COLLECTOR_INCIDENT_DATABASE_URL: ${TIDEGARD_DATABASE_URL:?run setup.sh first}
      TIDEGARD_COLLECTOR_INCIDENT_DATABASE_CA_FILE: /etc/tidegard/tls/ca.pem
      TIDEGARD_COLLECTOR_CLICKHOUSE_URL: https://clickhouse:8443
      TIDEGARD_COLLECTOR_CLICKHOUSE_CA_FILE: /etc/tidegard/tls/ca.pem
      TIDEGARD_COLLECTOR_CLICKHOUSE_USER: tidegard
      TIDEGARD_COLLECTOR_CLICKHOUSE_PASSWORD_FILE: /run/tidegard/clickhouse-password
    volumes:
      - *tls
      - ${TIDEGARD_DETECTION_POLICY:-../config/detection-policy.json}:/etc/tidegard/detection-policy.json:ro
      - ./secrets/clickhouse-password:/run/tidegard/clickhouse-password:ro
    ports:
      - "${TIDEGARD_FLOW_PUBLISH:-2055}:2055/udp"
      - "127.0.0.1:9090:9090"

  api:
    <<: *service
    image: ${TIDEGARD_IMAGE_PREFIX:-ghcr.io/logixhare/tidegard-}api:${TIDEGARD_VERSION:?set TIDEGARD_VERSION in .env}
    environment:
      # Off loopback, so TLS (ADR 0038), with the stack's certificate.
      TIDEGARD_API_BIND: 0.0.0.0:8443
      TIDEGARD_API_TLS_CERT_FILE: /etc/tidegard/tls/api.crt
      TIDEGARD_API_TLS_KEY_FILE: /etc/tidegard/tls/api.key
      TIDEGARD_API_DATABASE_URL: ${TIDEGARD_DATABASE_URL:?run setup.sh first}
      TIDEGARD_API_DATABASE_CA_FILE: /etc/tidegard/tls/ca.pem
      TIDEGARD_API_MITIGATION_GUARD_FILE: /etc/tidegard/guard.json
      TIDEGARD_API_TRAFFIC_TENANT: ${TIDEGARD_TRAFFIC_TENANT:-default}
      TIDEGARD_API_CLICKHOUSE_URL: https://clickhouse:8443
      TIDEGARD_API_CLICKHOUSE_CA_FILE: /etc/tidegard/tls/ca.pem
      TIDEGARD_API_CLICKHOUSE_USER: tidegard
      TIDEGARD_API_CLICKHOUSE_PASSWORD_FILE: /run/tidegard/clickhouse-password
    volumes:
      - *tls
      - ./tls/api.crt:/etc/tidegard/tls/api.crt:ro
      - ./tls/api.key:/etc/tidegard/tls/api.key:ro
      - ../config/guard.json:/etc/tidegard/guard.json:ro
      - ./secrets/clickhouse-password:/run/tidegard/clickhouse-password:ro
    ports:
      - "${TIDEGARD_API_PUBLISH:-127.0.0.1:8443}:8443"

  notifier:
    <<: *service
    image: ${TIDEGARD_IMAGE_PREFIX:-ghcr.io/logixhare/tidegard-}notifier:${TIDEGARD_VERSION:?set TIDEGARD_VERSION in .env}
    environment:
      TIDEGARD_NOTIFY_CONFIG: /etc/tidegard/notifier.json
      TIDEGARD_NOTIFY_DATABASE_URL: ${TIDEGARD_DATABASE_URL:?run setup.sh first}
      TIDEGARD_NOTIFY_DATABASE_CA_FILE: /etc/tidegard/tls/ca.pem
    volumes:
      - *tls
      - ${TIDEGARD_NOTIFIER_CONFIG:-../config/notifier.json}:/etc/tidegard/notifier.json:ro
    ports:
      - "127.0.0.1:9093:9093"

  mitigator:
    <<: *service
    image: ${TIDEGARD_IMAGE_PREFIX:-ghcr.io/logixhare/tidegard-}mitigator:${TIDEGARD_VERSION:?set TIDEGARD_VERSION in .env}
    environment:
      TIDEGARD_MITIGATOR_CONFIG: /etc/tidegard/mitigator.json
      TIDEGARD_MITIGATOR_DATABASE_URL: ${TIDEGARD_DATABASE_URL:?run setup.sh first}
      TIDEGARD_MITIGATOR_DATABASE_CA_FILE: /etc/tidegard/tls/ca.pem
    volumes:
      - *tls
      - ../config/mitigator.json:/etc/tidegard/mitigator.json:ro
      - ../config/guard.json:/etc/tidegard/guard.json:ro
    ports:
      - "127.0.0.1:9094:9094"

volumes:
  postgres:
  clickhouse:
