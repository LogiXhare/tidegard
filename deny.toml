# cargo-deny policy for the workspace (Phase 9D, supply chain).
# CI runs `cargo deny check` on every pull request: the Supply chain job
# in .github/workflows/validate.yml. docs/dependency-license-matrix.md
# records why each dependency is here; this file is what enforces it.

[graph]
all-features = true

[advisories]
# Every RustSec advisory, unmaintained and unsound included, fails CI
# unless it is listed here with the reason it does not apply.
ignore = []

[licenses]
# Permissive licences only, all compatible with the Apache-2.0 core
# (BQ-1). A new licence needs a row in the licence matrix first.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
# Two versions of one crate are reported, not refused: ten pairs come in
# through upstream crates that have not moved yet (syn 2 and 3, thiserror
# 1 and 2, logos 0.15 and 0.16 among them), and none is ours to fix.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependency, no other registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
