# cargo-about policy (FU-53): the third-party licence notices that ship
# with every release tarball, generated by scripts/package.sh. The
# accepted licences are deny.toml's; cargo deny enforces them, and this
# file only collects their texts.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# What the release binaries are built for. Build and dev dependencies do
# not end up in them.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates are not third-party.
private = { ignore = true }
