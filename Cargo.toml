[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/protocol-ipfix",
    "crates/classifier",
    "crates/aggregator",
    "crates/detector",
    "crates/incident",
    "crates/incident-postgres",
    "crates/incident-manager",
    "crates/storage",
    "crates/collector",
    "apps/api",
    "apps/cli",
    "tools/flow-replay",
]

# Only crates with real Phase 2 content are workspace members. Other
# crates/ and apps/ directories remain README-only placeholders (see
# their individual README.md) and are added to this list starting the
# phase that populates them — see docs/roadmap.md.

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "io-util"] }
prometheus = "0.14"
proptest = "1"

# Phase 5B-1 dependency probe (FU-42): versions pinned exactly as each
# ADR decided, so `cargo tree`/`cargo audit` measure the real candidate,
# not whatever a bare `"*"` would happen to resolve to today.
uuid = { version = "1.25", default-features = false, features = ["v7"] } # ADR 0019
tokio-postgres = "0.7.18" # ADR 0020
deadpool-postgres = "0.14.1" # ADR 0022
rustls = "0.23.43" # ADR 0023
tokio-postgres-rustls = "0.14.0" # ADR 0023
refinery = { version = "0.10.0", default-features = false, features = ["tokio-postgres"] } # ADR 0024
