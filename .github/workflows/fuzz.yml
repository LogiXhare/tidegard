name: Fuzz (IPFIX decoder)

# Scheduled/manual only — deliberately not part of validate.yml, since
# fuzzing needs a nightly toolchain that normal builds/tests never
# require (Phase 3 objective 13: "without making nightly mandatory for
# normal builds"). See crates/protocol-ipfix/fuzz/README.md.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzz duration in seconds"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz run decode_message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-08
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz target
        working-directory: crates/protocol-ipfix
        run: |
          seconds="${{ github.event.inputs.seconds || '300' }}"
          cargo fuzz run decode_message -- -max_total_time="$seconds"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crates/protocol-ipfix/fuzz/artifacts/
          if-no-files-found: ignore
