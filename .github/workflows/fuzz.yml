name: Fuzz (IPFIX decoder)

# Scheduled/manual only — deliberately not part of validate.yml, since
# fuzzing needs a nightly toolchain that normal builds/tests never
# require (Phase 3 objective 13: "without making nightly mandatory for
# normal builds"). See crates/protocol-ipfix/fuzz/README.md.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzz duration in seconds"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz run decode_message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-08
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz target
        working-directory: crates/protocol-ipfix
        run: |
          seconds="${{ github.event.inputs.seconds || '300' }}"
          cargo fuzz run decode_message -- -max_total_time="$seconds"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: crates/protocol-ipfix/fuzz/artifacts/
          if-no-files-found: ignore
