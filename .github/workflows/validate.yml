name: Validate

# Validation-only: no container image, no deployment, no release
# automation. As of Phase 2 this includes real build/test/lint for the
# Rust workspace (crates/, tools/flow-replay) — GitHub-hosted ubuntu-latest
# runners ship a Rust toolchain preinstalled, so no separate toolchain
# action is needed.
#
# Checks are deliberately grouped into five jobs rather than one job per
# check. Every job is a separate runner, billed with a one-minute minimum
# and starting from a cold cache: as nine jobs, fmt/clippy/test/build each
# recompiled the whole workspace independently, four times over. Grouping
# them lets a single `target/` directory be reused within the job. The
# split that remains is by *environment*, not by check:
#
#   rust     — needs the preinstalled Rust toolchain, plus a throwaway
#              gobgpd on loopback for the mitigator (ADR 0048) and the
#              two-speaker lab, a second gobgpd standing in for the edge
#              router (ADR 0051)
#   windows  — the same build and tests on a Windows runner, because the
#              persistence plan requires the suite to build on Windows and
#              Linux
#   postgres — Rust plus an ephemeral PostgreSQL service container, once
#              per supported version (ADR 0025), for crates/incident-postgres
#   grafana  — Rust plus throwaway ClickHouse, Prometheus and Grafana
#              containers, to run every dashboard query for real (ADR 0041),
#              and the collector's ClickHouse export over TLS (ADR 0053)
#   web      — Node, for the NOC UI in apps/web (ADR 0044)
#   e2e      — the UI in a real browser against the real API, incident
#              manager and PostgreSQL (Phase 6D-4), and the mitigator with
#              a throwaway gobgpd on loopback (Phase 7E)
#   package  — the release tarball, built natively on x86_64 and aarch64
#              Ubuntu 22.04 and installed with its own install.sh and
#              systemd units against a throwaway PostgreSQL; then one image
#              per service from it, run read-only and scanned (ADR 0052)
#   docs     — needs Node + Python
#   history  — needs full history (fetch-depth: 0), which the others do not
#
# Adding a check belongs in an existing job unless it genuinely needs a
# different environment.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The BGP lab (ADR 0048): a throwaway gobgpd, pinned by version and
      # checksum, its API on loopback and its BGP port closed. The
      # mitigator's tests announce to it; no route leaves the runner.
      - name: Start GoBGP for the mitigator tests
        run: bash scripts/start-gobgpd.sh
      # The two-speaker lab (ADR 0051): our speaker and an edge router
      # stand-in, peered over iBGP on 127.0.0.1 and 127.0.0.2 only.
      - name: Start the two-speaker BGP lab
        run: bash scripts/start-gobgp-lab.sh
      # crates/incident-postgres's tests run in the postgres job below, once
      # per supported PostgreSQL version. Here they would only skip.
      - name: Unit + property tests (the GoBGP labs must not skip)
        env:
          WETECHINETMON_GOBGP_TEST_ENDPOINT: http://127.0.0.1:50051
          WETECHINETMON_GOBGP_LAB_SPEAKER: http://127.0.0.1:50061
          WETECHINETMON_GOBGP_LAB_EDGE: http://127.0.0.1:50062
        run: |
          set -euo pipefail
          cargo test --workspace --exclude wetechinetmon-incident-postgres -- --nocapture 2>&1 | tee unit-test.log
          for lab in gobgp_lab two_speaker_lab; do
            if grep -q "skipping $lab:" unit-test.log; then
              echo "The $lab test skipped even though its gobgpd is up — failing."
              exit 1
            fi
          done
      - name: GoBGP logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/gobgp/gobgpd.log" || true
          tail -n 100 "$RUNNER_TEMP/gobgp-lab/speaker.log" "$RUNNER_TEMP/gobgp-lab/edge.log" || true
      - name: Build (all targets)
        run: cargo build --workspace --all-targets

  windows:
    name: Windows (build, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Windows runners have Rust preinstalled but cannot run service
      # containers, so crates/incident-postgres's tests skip here. They run
      # against real PostgreSQL in the postgres job; this job proves the
      # whole workspace builds and its other tests pass on Windows.
      - name: Build (all targets)
        run: cargo build --workspace --all-targets
      - name: Unit + property tests
        run: cargo test --workspace

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} (incident-postgres tests)
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not hide whether the others pass.
      fail-fast: false
      matrix:
        # ADR 0025: minimum 15, recommended 17, tested 15 through 18.
        postgres: ["15", "16", "17", "18"]
    # Ephemeral, job-scoped PostgreSQL (FU-46): the same throwaway
    # credential as crates/incident-postgres/docker-compose.yml, data on a
    # tmpfs destroyed with the runner. Never a real database; nothing here
    # is a secret. PGDATA is set explicitly under the tmpfs because the
    # PostgreSQL 18 image moved its default data directory.
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: wetechinetmon_test
          POSTGRES_PASSWORD: wetechinetmon_test_only
          POSTGRES_DB: wetechinetmon_incident_test
          PGDATA: /var/lib/postgresql/ci-data
        ports:
          - 55432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U wetechinetmon_test -d wetechinetmon_incident_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # ADR 0042: the API reads traffic from ClickHouse. A throwaway server
      # with a throwaway user, like the PostgreSQL one above.
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.24.9
        env:
          CLICKHOUSE_USER: wetechinetmon_test
          CLICKHOUSE_PASSWORD: wetechinetmon_test_only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 58123:8123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for ClickHouse
        run: |
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:58123/ping >/dev/null && exit 0
            sleep 1
          done
          echo "ClickHouse did not start"; exit 1
      - name: Server version
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U wetechinetmon_test -d wetechinetmon_incident_test -tAc "SHOW server_version"
      # ADR 0023: tests/tls_connector.rs needs a server with TLS on. A
      # throwaway CA and a server certificate naming only `localhost` are
      # generated per run under RUNNER_TEMP and die with the runner; a
      # second, unrelated CA is the one the test must refuse. None of it is
      # a secret or committed. TLS is turned on by reload, so plaintext
      # connections the other tests make keep working.
      - name: Turn on TLS with a throwaway CA
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pg-tls"
          mkdir -p "$dir"
          cd "$dir"
          for ca in ca other-ca; do
            openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=wetechinetmon CI $ca" \
              -addext "basicConstraints=critical,CA:TRUE" \
              -addext "keyUsage=critical,keyCertSign,cRLSign" \
              -keyout "$ca.key" -out "$ca.pem"
          done
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout server.key -out server.csr
          printf '%s\n' "subjectAltName=DNS:localhost" "basicConstraints=critical,CA:FALSE" \
            "keyUsage=critical,digitalSignature,keyEncipherment" "extendedKeyUsage=serverAuth" > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
            -extfile server.ext -out server.crt
          id="${{ job.services.postgres.id }}"
          docker exec "$id" mkdir -p /var/lib/postgresql/tls
          # docker cp cannot write into a tmpfs mount, so stream the files in.
          docker exec -i "$id" sh -c "cat > /var/lib/postgresql/tls/server.crt" < server.crt
          docker exec -i "$id" sh -c "cat > /var/lib/postgresql/tls/server.key" < server.key
          docker exec "$id" sh -c 'chown -R postgres:postgres /var/lib/postgresql/tls && chmod 600 /var/lib/postgresql/tls/server.key'
          docker exec "$id" psql -U wetechinetmon_test -d wetechinetmon_incident_test \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/tls/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/tls/server.key'" \
            -c "ALTER SYSTEM SET ssl = on" \
            -c "SELECT pg_reload_conf()"
          for attempt in $(seq 1 20); do
            state=$(docker exec "$id" psql -U wetechinetmon_test -d wetechinetmon_incident_test -tAc "SHOW ssl")
            [ "$state" = "on" ] && break
            sleep 0.5
          done
          [ "$state" = "on" ] || { echo "TLS did not turn on"; docker logs "$id" | tail -20; exit 1; }
          echo "WETECHINETMON_INCIDENT_POSTGRES_TEST_TLS_CA=$dir/ca.pem" >> "$GITHUB_ENV"
          echo "WETECHINETMON_INCIDENT_POSTGRES_TEST_TLS_OTHER_CA=$dir/other-ca.pem" >> "$GITHUB_ENV"
      # The PostgreSQL tests skip (and pass) when their URL variable is
      # unset, so a green run alone would not prove they ran. Run them with
      # output uncaptured, and fail if any skipped. The pattern matches the
      # skip message every such test prints ("skipping <test>: <VAR> is not
      # set"); unanchored, because uncaptured stderr can land mid-line in
      # libtest's own output.
      # The mitigator service test needs GoBGP as well as PostgreSQL
      # (ADR 0049); the mitigator crate's two-speaker lab test runs here
      # too, so its lab is started as well (ADR 0051).
      - name: Start GoBGP for the mitigator service test
        run: |
          bash scripts/start-gobgpd.sh
          bash scripts/start-gobgp-lab.sh
      - name: PostgreSQL tests (must not skip)
        env:
          WETECHINETMON_INCIDENT_POSTGRES_TEST_URL: "host=127.0.0.1 port=55432 user=wetechinetmon_test password=wetechinetmon_test_only dbname=wetechinetmon_incident_test"
          WETECHINETMON_CLICKHOUSE_TEST_URL: http://127.0.0.1:58123
          WETECHINETMON_CLICKHOUSE_TEST_USER: wetechinetmon_test
          WETECHINETMON_CLICKHOUSE_TEST_PASSWORD: wetechinetmon_test_only
          WETECHINETMON_GOBGP_TEST_ENDPOINT: http://127.0.0.1:50051
          WETECHINETMON_GOBGP_LAB_SPEAKER: http://127.0.0.1:50061
          WETECHINETMON_GOBGP_LAB_EDGE: http://127.0.0.1:50062
        run: |
          set -euo pipefail
          cargo test -p wetechinetmon-incident-postgres -p wetechinetmon-incident-manager -p wetechinetmon-collector -p wetechinetmon-api -p wetechinetmon-notification -p wetechinetmon-mitigator -- --nocapture 2>&1 | tee pg-test.log
          # Every ClickHouse row type, against the service container (ADR 0053).
          cargo test -p wetechinetmon-storage --test clickhouse_integration -- --nocapture 2>&1 | tee -a pg-test.log
          if grep -qE "skipping [a-z_]+: WETECHINETMON_[A-Z_]+ (or WETECHINETMON_[A-Z_]+ )?is not set" pg-test.log; then
            echo "A PostgreSQL test skipped even though the service container is up — failing."
            exit 1
          fi
      # NFR-2: an untested restore is not a backup. A real pg_dump of a
      # seeded database is restored into a fresh one, compared row for row,
      # and proven to work. The tools run inside the service container so
      # they match the server version under test.
      - name: Backup and restore drill
        env:
          WETECHINETMON_INCIDENT_POSTGRES_TEST_URL: "host=127.0.0.1 port=55432 user=wetechinetmon_test password=wetechinetmon_test_only dbname=wetechinetmon_incident_test"
          DRILL_PG_TOOL: docker exec -i ${{ job.services.postgres.id }}
          DRILL_WORK_DIR: ${{ runner.temp }}/backup-drill
        run: bash scripts/postgres-backup-restore-drill.sh

  grafana:
    name: Grafana dashboards (live queries)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway credentials for containers that live only in this job.
      CLICKHOUSE_USER: wnm_ci
      CLICKHOUSE_PASSWORD: ci-only-clickhouse
      GRAFANA_AUTH: admin:ci-only-grafana
      GRAFANA_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # HTTPS on 8443 too, with a certificate from a throwaway CA made here
      # and destroyed with the runner, for the collector's TLS export test
      # (ADR 0053). The key is world-readable only because ClickHouse runs
      # as another user inside its container.
      - name: Start ClickHouse and Prometheus
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ch-tls"
          mkdir -p "$dir"
          for ca in ca other-ca; do
            openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=wetechinetmon CI $ca" \
              -addext "basicConstraints=critical,CA:TRUE" \
              -addext "keyUsage=critical,keyCertSign,cRLSign" \
              -keyout "$dir/$ca.key" -out "$dir/$ca.pem"
          done
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" \
            -keyout "$dir/server.key" -out "$dir/server.csr"
          printf '%s\n' "subjectAltName=DNS:localhost" "basicConstraints=critical,CA:FALSE" \
            "keyUsage=critical,digitalSignature,keyEncipherment" "extendedKeyUsage=serverAuth" \
            > "$dir/server.ext"
          openssl x509 -req -in "$dir/server.csr" -CA "$dir/ca.pem" -CAkey "$dir/ca.key" \
            -CAcreateserial -days 2 -extfile "$dir/server.ext" -out "$dir/server.crt"
          chmod 0644 "$dir/server.key"
          cat > "$dir/tls.xml" <<'XML'
          <clickhouse>
            <https_port>8443</https_port>
            <openSSL>
              <server>
                <certificateFile>/etc/clickhouse-server/tls/server.crt</certificateFile>
                <privateKeyFile>/etc/clickhouse-server/tls/server.key</privateKeyFile>
                <verificationMode>none</verificationMode>
                <loadDefaultCAFile>false</loadDefaultCAFile>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
              </server>
            </openSSL>
          </clickhouse>
          XML
          printf '%s\n' "$CLICKHOUSE_PASSWORD" > "$dir/password"
          {
            echo "WETECHINETMON_CLICKHOUSE_TLS_TEST_URL=https://localhost:8443"
            echo "WETECHINETMON_CLICKHOUSE_TLS_TEST_CA=$dir/ca.pem"
            echo "WETECHINETMON_CLICKHOUSE_TLS_TEST_OTHER_CA=$dir/other-ca.pem"
            echo "WETECHINETMON_CLICKHOUSE_TLS_TEST_USER=$CLICKHOUSE_USER"
            echo "WETECHINETMON_CLICKHOUSE_TLS_TEST_PASSWORD_FILE=$dir/password"
          } >> "$GITHUB_ENV"
          docker network create wnm
          docker run -d --name clickhouse --network wnm -p 127.0.0.1:8123:8123 \
            -p 127.0.0.1:8443:8443 \
            -e CLICKHOUSE_USER -e CLICKHOUSE_PASSWORD \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -v "$dir/tls.xml:/etc/clickhouse-server/config.d/tls.xml:ro" \
            -v "$dir:/etc/clickhouse-server/tls:ro" \
            clickhouse/clickhouse-server:26.8.24.9
          docker run -d --name prometheus --network wnm prom/prometheus:v3.13.4
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8123/ping >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/ping
      - name: Create the ClickHouse schema (the first run on a real server)
        run: |
          set -euo pipefail
          cargo run --quiet -p wetechinetmon-dashboard-check --bin clickhouse-schema > schema.sql
          while IFS= read -r statement; do
            curl -sS --fail-with-body --user "$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD" \
              --data-binary "$statement" http://127.0.0.1:8123/
          done < schema.sql
          curl -sS --fail-with-body --user "$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD" \
            --data-binary "SELECT name FROM system.tables WHERE database = 'default' ORDER BY name" \
            http://127.0.0.1:8123/
      # The test skips (and passes) without its variables, so fail if it
      # skipped: a green run must mean it ran.
      - name: The collector's ClickHouse export over TLS (ADR 0053)
        run: |
          set -euo pipefail
          for _ in $(seq 30); do
            curl -sf --cacert "$WETECHINETMON_CLICKHOUSE_TLS_TEST_CA" https://localhost:8443/ping >/dev/null && break
            sleep 1
          done
          cargo test -p wetechinetmon-storage --test clickhouse_tls -- --nocapture 2>&1 | tee tls-test.log
          ! grep -q "skipping exports_over_verified_tls_with_credentials" tls-test.log
          grep -q "test exports_over_verified_tls_with_credentials ... ok" tls-test.log
      - name: Start Grafana with the shipped dashboards
        run: |
          set -euo pipefail
          # The background installer would otherwise update bundled plugins
          # after start, unregistering each for a moment mid-test: only the
          # pinned ClickHouse plugin is installed, and nothing auto-updates.
          # CI's own datasources: plain HTTP inside this job's private
          # network. The shipped example uses TLS.
          mkdir -p ci-datasources
          cat > ci-datasources/ci.yaml <<'EOF'
          apiVersion: 1
          datasources:
            - name: CI Prometheus
              uid: wnm-prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
            - name: CI ClickHouse
              uid: wnm-clickhouse
              type: grafana-clickhouse-datasource
              jsonData:
                host: clickhouse
                port: 8123
                protocol: http
                secure: false
                username: $CLICKHOUSE_USER
                defaultDatabase: default
              secureJsonData:
                password: $CLICKHOUSE_PASSWORD
          EOF
          docker run -d --name grafana --network wnm -p 127.0.0.1:3000:3000 \
            -e GF_SECURITY_ADMIN_PASSWORD="${GRAFANA_AUTH#admin:}" \
            -e GF_PLUGINS_PREINSTALL_SYNC=grafana-clickhouse-datasource@4.21.3 \
            -e GF_PLUGINS_PREINSTALL=grafana-clickhouse-datasource@4.21.3 \
            -e GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false \
            -e CLICKHOUSE_USER -e CLICKHOUSE_PASSWORD \
            -v "$PWD/ci-datasources:/etc/grafana/provisioning/datasources:ro" \
            -v "$PWD/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro" \
            -v "$PWD/grafana/dashboards:/var/lib/grafana/dashboards/wetechinetmon:ro" \
            grafana/grafana:13.2.3
          for _ in $(seq 120); do
            curl -sf "$GRAFANA_URL/api/health" >/dev/null && break
            sleep 1
          done
          curl -sf "$GRAFANA_URL/api/health"
          # /api/health answers before the datasource plugins register, so
          # wait until each datasource passes its own health check.
          for uid in wnm-prometheus wnm-clickhouse; do
            for _ in $(seq 120); do
              curl -sf --user "$GRAFANA_AUTH" "$GRAFANA_URL/api/datasources/uid/$uid/health" >/dev/null && break
              sleep 1
            done
            curl -sS --fail-with-body --user "$GRAFANA_AUTH" "$GRAFANA_URL/api/datasources/uid/$uid/health"
            echo
          done
      - name: Run every panel query
        run: scripts/grafana-dashboard-live-check.sh grafana/dashboards
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs grafana 2>&1 | tail -n 100
          docker logs clickhouse 2>&1 | tail -n 50

  web:
    name: Web UI (lint, types, tests, build, audit, licences)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Exactly the lockfile, and no install scripts (R22, ADR 0044).
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint (includes the T-08 untrusted-HTML rule)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: The page has no inline script or style (the CSP forbids them)
        run: |
          if grep -qiE '<script>|<script [^>]*>[^<]|<style|style=' dist/index.html; then
            echo "dist/index.html holds inline code"; exit 1
          fi
      - name: Known vulnerabilities
        run: npm audit --audit-level=high
      - name: Licences
        run: npm run licences

  e2e:
    name: Web end-to-end (Playwright, real API and PostgreSQL)
    # The check keeps its name; it covers GoBGP too since Phase 7E.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same throwaway database as the postgres job; nothing here is a
    # secret. The stack runs on loopback only.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wetechinetmon_test
          POSTGRES_PASSWORD: wetechinetmon_test_only
          POSTGRES_DB: wetechinetmon_incident_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wetechinetmon_test -d wetechinetmon_incident_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE: "host=127.0.0.1 port=55432 user=wetechinetmon_test password=wetechinetmon_test_only dbname=wetechinetmon_incident_test"
      E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build the API, the incident manager and the mitigator
        run: cargo build -p wetechinetmon-api -p wetechinetmon-incident-manager -p wetechinetmon-mitigator
      # The BGP lab (ADR 0048): gobgpd's API on loopback, its BGP port
      # closed, so no route leaves the runner.
      - name: Start GoBGP for the mitigator
        run: bash scripts/start-gobgpd.sh
      - name: Build the UI and install the browser
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm run build
          npx playwright install --with-deps chromium
      - name: Start the stack and seed one incident
        run: |
          set -euo pipefail
          # The incident manager applies the migrations, then keeps running.
          # It reports ready once its first correlation batch succeeds, so
          # after the migrations (ADR 0052).
          WETECHINETMON_INCIDENT_DATABASE_URL="$DATABASE" \
            WETECHINETMON_INCIDENT_METRICS_BIND=127.0.0.1:9091 \
            target/debug/wetechinetmon-incident-manager > manager.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:9091/readyz >/dev/null && break
            sleep 1
          done
          curl -sS --fail-with-body http://127.0.0.1:9091/readyz
          curl -sS --fail-with-body http://127.0.0.1:9091/healthz
          token=$(WETECHINETMON_API_DATABASE_URL="$DATABASE" target/debug/wetechinetmon-api \
            token create --tenant acme --actor-id e2e-lead --role noc_lead --days 1 \
            | awk '/^token:/ {print $2}')
          [ -n "$token" ] || { echo "no token was created"; exit 1; }
          echo "::add-mask::$token"
          echo "E2E_TOKEN=$token" >> "$GITHUB_ENV"
          # A second person, for the four-eyes rule: requests, never approves.
          operator=$(WETECHINETMON_API_DATABASE_URL="$DATABASE" target/debug/wetechinetmon-api \
            token create --tenant acme --actor-id e2e-operator --role senior_operator --days 1 \
            | awk '/^token:/ {print $2}')
          [ -n "$operator" ] || { echo "no operator token was created"; exit 1; }
          echo "::add-mask::$operator"
          echo "E2E_OPERATOR_TOKEN=$operator" >> "$GITHUB_ENV"
          # One guard for the API and the mitigator (ADR 0050): announcing for
          # real, but only TEST-NET-3, and only for acme.
          cat > "$RUNNER_TEMP/guard.json" <<'JSON'
          {"dry_run": false, "bgp_enabled": true,
           "allowlist": [{"prefix": "203.0.113.0/24", "tenant": "acme", "actions": ["rtbh"]}]}
          JSON
          cat > "$RUNNER_TEMP/mitigator.json" <<JSON
          {"guard_file": "$RUNNER_TEMP/guard.json",
           "routes": {"local_asn": 65001, "rtbh_next_hop_ipv4": "192.0.2.1",
                      "rtbh_next_hop_ipv6": "2001:db8::1"},
           "gobgp": {"url": "http://127.0.0.1:50051"},
           "poll_interval_ms": 500, "reconcile_interval_seconds": 5}
          JSON
          WETECHINETMON_MITIGATOR_DATABASE_URL="$DATABASE" \
            WETECHINETMON_MITIGATOR_CONFIG="$RUNNER_TEMP/mitigator.json" \
            target/debug/wetechinetmon-mitigator > mitigator.log 2>&1 &
          WETECHINETMON_API_DATABASE_URL="$DATABASE" \
            WETECHINETMON_API_WEB_ROOT=apps/web/dist \
            WETECHINETMON_API_MITIGATION_GUARD_FILE="$RUNNER_TEMP/guard.json" \
            target/debug/wetechinetmon-api > api.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf "$E2E_BASE_URL/readyz" >/dev/null && break
            sleep 1
          done
          curl -sS --fail-with-body "$E2E_BASE_URL/readyz"
          # The mitigator (metrics on its default 127.0.0.1:9094) is ready
          # once it holds the lock and a pass succeeds.
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:9094/readyz >/dev/null && break
            sleep 1
          done
          curl -sS --fail-with-body http://127.0.0.1:9094/readyz
          # One open incident whose title is hostile markup (T-08).
          curl -sS --fail-with-body -X POST "$E2E_BASE_URL/api/v1/incidents" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -H "Idempotency-Key: e2e-seed-incident-0001" \
            --data '{"title":"<img src=x onerror=\"window.__pwned=1\">Spoofed sources","severity":"major","target_scope":"host","target":"203.0.113.90","direction":"incoming"}' \
            >/dev/null
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 50 api.log manager.log mitigator.log "$RUNNER_TEMP/gobgp/gobgpd.log" || true

  package:
    name: Package (${{ matrix.arch }} tarball, systemd, images, Compose)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # ADR 0052: built natively on 22.04, so glibc 2.35 is the floor.
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            trivy_asset: Linux-64bit
            trivy_sha256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          - arch: aarch64
            runner: ubuntu-22.04-arm
            trivy_asset: Linux-ARM64
            trivy_sha256: b94ce1976bbf3c15b514b605ee88be7c6d94a29be2302847ff01cb794d47aad5
    # The same throwaway credential as the other jobs; never a real database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wetechinetmon
          POSTGRES_PASSWORD: wetechinetmon_test_only
          POSTGRES_DB: wetechinetmon
        ports:
          - 55432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U wetechinetmon -d wetechinetmon"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The arm64 image does not always carry a Rust toolchain.
      - name: Rust toolchain
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Lint the shell scripts and the Dockerfile
        if: matrix.arch == 'x86_64'
        env:
          HADOLINT_VERSION: 2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          set -euo pipefail
          shellcheck scripts/*.sh deployments/systemd/install.sh deployments/docker-compose/setup.sh
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "$HADOLINT_SHA256  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" deployments/docker/Dockerfile
      - name: Build the tarball
        run: bash scripts/package.sh "0.0.0-ci.${GITHUB_SHA::12}" dist
      - name: Install from the tarball, as an operator would
        run: |
          set -euo pipefail
          tar -xzf dist/wetechinetmon-*.tar.gz -C "$RUNNER_TEMP"
          unpacked=$(echo "$RUNNER_TEMP"/wetechinetmon-*/)
          sudo "$unpacked/install.sh"
          # A second run keeps every installed setting.
          sudo "$unpacked/install.sh" | tee second-run.log
          grep -q "kept     /etc/wetechinetmon/guard.json" second-run.log
          ! grep -q "^created" second-run.log
          # Secrets are root's alone; each JSON file is its reader's.
          sudo stat -c '%a %U %G %n' /etc/wetechinetmon/* | tee modes.log
          [ "$(grep -c '^600 root root .*\.env$' modes.log)" -eq 5 ]
          grep -q '^640 root wetechinetmon-guard /etc/wetechinetmon/guard.json$' modes.log
          id wetechinetmon-api | grep -q wetechinetmon-guard
          sudo systemd-analyze verify /etc/systemd/system/wetechinetmon-*.service
          # Point every service at the CI database.
          sudo sed -i \
            's/host=127.0.0.1 user=wetechinetmon password=CHANGE_ME/host=127.0.0.1 port=55432 user=wetechinetmon password=wetechinetmon_test_only/' \
            /etc/wetechinetmon/*.env
      - name: Start every service and wait until each is ready
        run: |
          set -euo pipefail
          ready() {
            for _ in $(seq 60); do
              curl -sf "http://127.0.0.1:$1/readyz" >/dev/null && return 0
              sleep 1
            done
            curl -sS --fail-with-body "http://127.0.0.1:$1/readyz"
          }
          # The incident manager applies the migrations first.
          sudo systemctl start wetechinetmon-incident-manager
          ready 9091
          sudo systemctl start wetechinetmon-api wetechinetmon-collector \
            wetechinetmon-notifier wetechinetmon-mitigator
          for port in 8080 9090 9093 9094; do ready "$port"; done
          curl -sf http://127.0.0.1:9090/healthz
          # The NOC UI is served from the installed share/web.
          curl -sf http://127.0.0.1:8080/ | grep -q '<title>WetechiNetMon NOC</title>'
          # The packaged mitigator runs dry-run with BGP off.
          sudo journalctl -u wetechinetmon-mitigator --no-pager \
            | grep '"the mitigator is active"' | grep -q 'bgp_enabled.*false'
          # The CLI reaches the API with a token the host command issued.
          token=$(sudo env WETECHINETMON_API_DATABASE_URL="host=127.0.0.1 port=55432 user=wetechinetmon password=wetechinetmon_test_only dbname=wetechinetmon" \
            /opt/wetechinetmon/bin/wetechinetmon-api token create --tenant default \
            --actor-id ci-viewer --role viewer --days 1 | awk '/^token:/ {print $2}')
          [ -n "$token" ]
          echo "::add-mask::$token"
          WETECHINETMON_API_URL=http://127.0.0.1:8080 WETECHINETMON_API_TOKEN="$token" \
            /opt/wetechinetmon/bin/wetechinetmonctl incidents list
      # ADR 0052: one image per service, built from the tarball just
      # installed, so what is scanned is what ships.
      - name: Build the images from the tarball
        run: |
          set -euo pipefail
          unpacked=$(echo "$RUNNER_TEMP"/wetechinetmon-*/)
          for target in collector incident-manager api notifier mitigator; do
            docker build -q -f deployments/docker/Dockerfile --target "$target" \
              --build-arg VERSION="0.0.0-ci.${GITHUB_SHA::12}" \
              -t "wetechinetmon-$target:ci" "$unpacked"
            user=$(docker image inspect -f '{{.Config.User}}' "wetechinetmon-$target:ci")
            [ "$user" = "65532:65532" ] || { echo "$target runs as '$user'"; exit 1; }
          done
          docker image ls 'wetechinetmon-*'
      - name: Run an image with a read-only root filesystem
        run: |
          set -euo pipefail
          docker run -d --name ci-collector --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:19090:9090 wetechinetmon-collector:ci
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:19090/readyz >/dev/null && break
            sleep 1
          done
          curl -sS --fail-with-body http://127.0.0.1:19090/readyz
          docker rm -f ci-collector
      # Trivy is installed from its release, pinned by version and SHA-256,
      # not through its GitHub Action (CVE-2026-33634 replaced that action's
      # tags in March 2026; v0.74.0 came months later and was never affected).
      - name: Scan the images (Trivy, fixable Critical and High fail)
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_${{ matrix.trivy_asset }}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "${{ matrix.trivy_sha256 }}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" trivy
          for target in collector incident-manager api notifier mitigator; do
            "$RUNNER_TEMP/trivy" image --quiet --scanners vuln --ignore-unfixed \
              --severity CRITICAL,HIGH --exit-code 1 "wetechinetmon-$target:ci"
          done
      # ADR 0052: the reference stack from the images just built, TLS
      # between every container, and synthetic flows (flow-replay's local
      # range, 10.0.0.0/8) that must end as an incident.
      - name: The Compose stack, end to end
        working-directory: deployments/docker-compose
        run: |
          set -euo pipefail
          # The systemd install above holds the same ports.
          sudo systemctl stop wetechinetmon-collector wetechinetmon-incident-manager \
            wetechinetmon-api wetechinetmon-notifier wetechinetmon-mitigator
          sudo ./setup.sh ci
          cat > "$RUNNER_TEMP/ci-policy.json" <<'JSON'
          {"schemaVersion": 1,
           "tenants": [{"tenant": "default", "prefixes": ["10.0.0.0/8"]}],
           "policies": [{"id": "ci-host-inbound", "name": "CI host inbound", "tenant": "default",
             "scopeType": "host", "direction": "incoming", "window": "1s",
             "thresholds": {"bps": "1M"}, "triggerFor": "2s", "clearFor": "5s",
             "cooldown": "10s", "severity": "critical", "executionMode": "dryRun"}]}
          JSON
          {
            echo "WETECHINETMON_IMAGE_PREFIX=wetechinetmon-"
            echo "WETECHINETMON_LOCAL_PREFIXES=10.0.0.0/8@default"
            echo "WETECHINETMON_DETECTION_POLICY=$RUNNER_TEMP/ci-policy.json"
          } >> .env
          stat -c '%a %U %n' .env tls/*.key secrets/*
          docker compose up -d --wait --wait-timeout 180 postgres clickhouse
          docker compose up -d
          for port in 9091 9090 9093 9094; do
            for _ in $(seq 90); do
              curl -sf "http://127.0.0.1:$port/readyz" >/dev/null && break
              sleep 1
            done
            curl -sS --fail-with-body "http://127.0.0.1:$port/readyz"
          done
          for _ in $(seq 60); do
            curl -sf --cacert tls/ca.pem https://127.0.0.1:8443/readyz >/dev/null && break
            sleep 1
          done
          curl -sS --fail-with-body --cacert tls/ca.pem https://127.0.0.1:8443/readyz
          echo
          # No plaintext between containers: ClickHouse's plain ports are gone.
          for port in 8123 9000; do
            if docker compose exec -T clickhouse bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "ClickHouse listens on plaintext port $port"; exit 1
            fi
          done
          cargo run -q -p wetechinetmon-flow-replay -- 127.0.0.1:2055 \
            --pattern flood --duration-secs 20 --peak-bps 20000000
          token=$(docker compose exec -T api wetechinetmon-api token create --tenant default \
            --actor-id ci-viewer --role viewer --days 1 | awk '/^token:/ {print $2}')
          [ -n "$token" ]
          echo "::add-mask::$token"
          for _ in $(seq 30); do
            count=$(curl -sf --cacert tls/ca.pem -H "Authorization: Bearer $token" \
              https://127.0.0.1:8443/api/v1/incidents \
              | python3 -c 'import json, sys; print(len(json.load(sys.stdin)["items"]))')
            [ "$count" -ge 1 ] && break
            sleep 2
          done
          echo "incidents: $count"
          [ "$count" -ge 1 ]
          # The flows reached ClickHouse over TLS too (ADR 0053).
          docker compose logs collector | grep -q "ClickHouse export enabled"
      - name: Compose logs on failure
        if: failure()
        working-directory: deployments/docker-compose
        run: |
          docker compose logs --no-color --tail 80 || true
          docker compose exec -T clickhouse tail -n 40 /var/log/clickhouse-server/clickhouse-server.err.log || true
      - name: systemd's exposure rating for each unit
        run: |
          for service in collector incident-manager api notifier mitigator; do
            systemd-analyze security --no-pager "wetechinetmon-$service.service" | tail -n 1
          done
      - name: Logs on failure
        if: failure()
        run: sudo journalctl -u 'wetechinetmon-*' --no-pager -n 200 || true

  docs:
    name: Docs (Markdown, YAML, links, MkDocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Markdown lint
        run: npx -y markdownlint-cli2@0.13.0 "**/*.md" "#node_modules"
      - name: Validate YAML syntax
        run: |
          set -euo pipefail
          npm install --no-save js-yaml@4
          status=0
          while IFS= read -r -d '' f; do
            node -e "require('js-yaml').load(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" \
              && echo "OK: $f" \
              || { echo "INVALID YAML: $f"; status=1; }
          done < <(find . -type f \( -name '*.yml' -o -name '*.yaml' \) -not -path './node_modules/*' -not -path './.git/*' -print0)
          exit "$status"
      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/mlc_config.json"
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Build docs (strict — fails on broken nav/links)
        run: mkdocs build --strict

  history:
    name: History (secret scan, DCO sign-off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action needs a paid licence once the repository belongs to
      # an organisation, and without one it failed before scanning
      # anything. The gitleaks binary itself is MIT-licensed and free, so
      # run it directly: pinned by version, verified against the release's
      # SHA-256, over the whole history (about a second at this size).
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
      # Dependabot's pull requests carry no sign-off, so they need an
      # exemption — but it is keyed on the pull request's author login,
      # which GitHub sets and a contributor cannot forge. It must never be
      # keyed on commit author metadata: anyone can run
      # `git config user.name 'x[bot]'` and walk straight past a check that
      # trusts the commit's own author string.
      #
      # Scope, deliberately: this runs on pull_request only. Commits pushed
      # directly to a branch are not checked (the repository has no branch
      # protection today), and a squash merge replaces the checked commits
      # with a new one — so whoever squashes must keep a Signed-off-by
      # trailer in the squash message. Merge commits are skipped by
      # --no-merges; the commits they bring in are still checked.
      #
      # always(): a failed secret scan must not hide whether the sign-offs
      # are in order, so this runs whatever the step above concluded.
      - name: DCO sign-off check
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'github-actions[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r sha; do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%h %s' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "OK:      $subject"
            else
              echo "MISSING: $subject — needs 'Signed-off-by: $author'"
              status=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA")
          if [ "$status" -ne 0 ]; then
            echo
            echo "Every commit needs a DCO sign-off matching its author — see the DCO file."
            echo "Fix the latest commit with:  git commit -s --amend"
            echo "Fix a whole branch with:     git rebase --signoff $BASE_SHA"
          fi
          exit "$status"
