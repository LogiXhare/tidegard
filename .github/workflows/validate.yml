name: Validate

# Validation-only: no container image, no deployment, no release
# automation. As of Phase 2 this includes real build/test/lint for the
# Rust workspace (crates/, tools/flow-replay) — GitHub-hosted ubuntu-latest
# runners ship a Rust toolchain preinstalled, so no separate toolchain
# action is needed.
#
# Checks are deliberately grouped into five jobs rather than one job per
# check. Every job is a separate runner, billed with a one-minute minimum
# and starting from a cold cache: as nine jobs, fmt/clippy/test/build each
# recompiled the whole workspace independently, four times over. Grouping
# them lets a single `target/` directory be reused within the job. The
# split that remains is by *environment*, not by check:
#
#   rust     — needs the preinstalled Rust toolchain
#   windows  — the same build and tests on a Windows runner, because the
#              persistence plan requires the suite to build on Windows and
#              Linux
#   postgres — Rust plus an ephemeral PostgreSQL service container, once
#              per supported version (ADR 0025), for crates/incident-postgres
#   grafana  — Rust plus throwaway ClickHouse, Prometheus and Grafana
#              containers, to run every dashboard query for real (ADR 0041)
#   web      — Node, for the NOC UI in apps/web (ADR 0044)
#   e2e      — the UI in a real browser against the real API, incident
#              manager and PostgreSQL (Phase 6D-4)
#   docs     — needs Node + Python
#   history  — needs full history (fetch-depth: 0), which the others do not
#
# Adding a check belongs in an existing job unless it genuinely needs a
# different environment.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # crates/incident-postgres's tests run in the postgres job below, once
      # per supported PostgreSQL version. Here they would only skip.
      - name: Unit + property tests
        run: cargo test --workspace --exclude wetechinetmon-incident-postgres
      - name: Build (all targets)
        run: cargo build --workspace --all-targets

  windows:
    name: Windows (build, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Windows runners have Rust preinstalled but cannot run service
      # containers, so crates/incident-postgres's tests skip here. They run
      # against real PostgreSQL in the postgres job; this job proves the
      # whole workspace builds and its other tests pass on Windows.
      - name: Build (all targets)
        run: cargo build --workspace --all-targets
      - name: Unit + property tests
        run: cargo test --workspace

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} (incident-postgres tests)
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not hide whether the others pass.
      fail-fast: false
      matrix:
        # ADR 0025: minimum 15, recommended 17, tested 15 through 18.
        postgres: ["15", "16", "17", "18"]
    # Ephemeral, job-scoped PostgreSQL (FU-46): the same throwaway
    # credential as crates/incident-postgres/docker-compose.yml, data on a
    # tmpfs destroyed with the runner. Never a real database; nothing here
    # is a secret. PGDATA is set explicitly under the tmpfs because the
    # PostgreSQL 18 image moved its default data directory.
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: wetechinetmon_test
          POSTGRES_PASSWORD: wetechinetmon_test_only
          POSTGRES_DB: wetechinetmon_incident_test
          PGDATA: /var/lib/postgresql/ci-data
        ports:
          - 55432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U wetechinetmon_test -d wetechinetmon_incident_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # ADR 0042: the API reads traffic from ClickHouse. A throwaway server
      # with a throwaway user, like the PostgreSQL one above.
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.24.9
        env:
          CLICKHOUSE_USER: wetechinetmon_test
          CLICKHOUSE_PASSWORD: wetechinetmon_test_only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 58123:8123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for ClickHouse
        run: |
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:58123/ping >/dev/null && exit 0
            sleep 1
          done
          echo "ClickHouse did not start"; exit 1
      - name: Server version
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U wetechinetmon_test -d wetechinetmon_incident_test -tAc "SHOW server_version"
      # ADR 0023: tests/tls_connector.rs needs a server with TLS on. A
      # throwaway CA and a server certificate naming only `localhost` are
      # generated per run under RUNNER_TEMP and die with the runner; a
      # second, unrelated CA is the one the test must refuse. None of it is
      # a secret or committed. TLS is turned on by reload, so plaintext
      # connections the other tests make keep working.
      - name: Turn on TLS with a throwaway CA
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pg-tls"
          mkdir -p "$dir"
          cd "$dir"
          for ca in ca other-ca; do
            openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=wetechinetmon CI $ca" \
              -addext "basicConstraints=critical,CA:TRUE" \
              -addext "keyUsage=critical,keyCertSign,cRLSign" \
              -keyout "$ca.key" -out "$ca.pem"
          done
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout server.key -out server.csr
          printf '%s\n' "subjectAltName=DNS:localhost" "basicConstraints=critical,CA:FALSE" \
            "keyUsage=critical,digitalSignature,keyEncipherment" "extendedKeyUsage=serverAuth" > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
            -extfile server.ext -out server.crt
          id="${{ job.services.postgres.id }}"
          docker exec "$id" mkdir -p /var/lib/postgresql/tls
          # docker cp cannot write into a tmpfs mount, so stream the files in.
          docker exec -i "$id" sh -c "cat > /var/lib/postgresql/tls/server.crt" < server.crt
          docker exec -i "$id" sh -c "cat > /var/lib/postgresql/tls/server.key" < server.key
          docker exec "$id" sh -c 'chown -R postgres:postgres /var/lib/postgresql/tls && chmod 600 /var/lib/postgresql/tls/server.key'
          docker exec "$id" psql -U wetechinetmon_test -d wetechinetmon_incident_test \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/tls/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/tls/server.key'" \
            -c "ALTER SYSTEM SET ssl = on" \
            -c "SELECT pg_reload_conf()"
          for attempt in $(seq 1 20); do
            state=$(docker exec "$id" psql -U wetechinetmon_test -d wetechinetmon_incident_test -tAc "SHOW ssl")
            [ "$state" = "on" ] && break
            sleep 0.5
          done
          [ "$state" = "on" ] || { echo "TLS did not turn on"; docker logs "$id" | tail -20; exit 1; }
          echo "WETECHINETMON_INCIDENT_POSTGRES_TEST_TLS_CA=$dir/ca.pem" >> "$GITHUB_ENV"
          echo "WETECHINETMON_INCIDENT_POSTGRES_TEST_TLS_OTHER_CA=$dir/other-ca.pem" >> "$GITHUB_ENV"
      # The PostgreSQL tests skip (and pass) when their URL variable is
      # unset, so a green run alone would not prove they ran. Run them with
      # output uncaptured, and fail if any skipped. The pattern matches the
      # skip message every such test prints ("skipping <test>: <VAR> is not
      # set"); unanchored, because uncaptured stderr can land mid-line in
      # libtest's own output.
      - name: PostgreSQL tests (must not skip)
        env:
          WETECHINETMON_INCIDENT_POSTGRES_TEST_URL: "host=127.0.0.1 port=55432 user=wetechinetmon_test password=wetechinetmon_test_only dbname=wetechinetmon_incident_test"
          WETECHINETMON_CLICKHOUSE_TEST_URL: http://127.0.0.1:58123
          WETECHINETMON_CLICKHOUSE_TEST_USER: wetechinetmon_test
          WETECHINETMON_CLICKHOUSE_TEST_PASSWORD: wetechinetmon_test_only
        run: |
          set -euo pipefail
          cargo test -p wetechinetmon-incident-postgres -p wetechinetmon-incident-manager -p wetechinetmon-collector -p wetechinetmon-api -p wetechinetmon-notification -- --nocapture 2>&1 | tee pg-test.log
          if grep -qE "skipping [a-z_]+: WETECHINETMON_[A-Z_]+ (or WETECHINETMON_[A-Z_]+ )?is not set" pg-test.log; then
            echo "A PostgreSQL test skipped even though the service container is up — failing."
            exit 1
          fi
      # NFR-2: an untested restore is not a backup. A real pg_dump of a
      # seeded database is restored into a fresh one, compared row for row,
      # and proven to work. The tools run inside the service container so
      # they match the server version under test.
      - name: Backup and restore drill
        env:
          WETECHINETMON_INCIDENT_POSTGRES_TEST_URL: "host=127.0.0.1 port=55432 user=wetechinetmon_test password=wetechinetmon_test_only dbname=wetechinetmon_incident_test"
          DRILL_PG_TOOL: docker exec -i ${{ job.services.postgres.id }}
          DRILL_WORK_DIR: ${{ runner.temp }}/backup-drill
        run: bash scripts/postgres-backup-restore-drill.sh

  grafana:
    name: Grafana dashboards (live queries)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway credentials for containers that live only in this job.
      CLICKHOUSE_USER: wnm_ci
      CLICKHOUSE_PASSWORD: ci-only-clickhouse
      GRAFANA_AUTH: admin:ci-only-grafana
      GRAFANA_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start ClickHouse and Prometheus
        run: |
          set -euo pipefail
          docker network create wnm
          docker run -d --name clickhouse --network wnm -p 127.0.0.1:8123:8123 \
            -e CLICKHOUSE_USER -e CLICKHOUSE_PASSWORD \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            clickhouse/clickhouse-server:26.8.24.9
          docker run -d --name prometheus --network wnm prom/prometheus:v3.13.4
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8123/ping >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/ping
      - name: Create the ClickHouse schema (the first run on a real server)
        run: |
          set -euo pipefail
          cargo run --quiet -p wetechinetmon-dashboard-check --bin clickhouse-schema > schema.sql
          while IFS= read -r statement; do
            curl -sS --fail-with-body --user "$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD" \
              --data-binary "$statement" http://127.0.0.1:8123/
          done < schema.sql
          curl -sS --fail-with-body --user "$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD" \
            --data-binary "SELECT name FROM system.tables WHERE database = 'default' ORDER BY name" \
            http://127.0.0.1:8123/
      - name: Start Grafana with the shipped dashboards
        run: |
          set -euo pipefail
          # The background installer would otherwise update bundled plugins
          # after start, unregistering each for a moment mid-test: only the
          # pinned ClickHouse plugin is installed, and nothing auto-updates.
          # CI's own datasources: plain HTTP inside this job's private
          # network. The shipped example uses TLS.
          mkdir -p ci-datasources
          cat > ci-datasources/ci.yaml <<'EOF'
          apiVersion: 1
          datasources:
            - name: CI Prometheus
              uid: wnm-prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
            - name: CI ClickHouse
              uid: wnm-clickhouse
              type: grafana-clickhouse-datasource
              jsonData:
                host: clickhouse
                port: 8123
                protocol: http
                secure: false
                username: $CLICKHOUSE_USER
                defaultDatabase: default
              secureJsonData:
                password: $CLICKHOUSE_PASSWORD
          EOF
          docker run -d --name grafana --network wnm -p 127.0.0.1:3000:3000 \
            -e GF_SECURITY_ADMIN_PASSWORD="${GRAFANA_AUTH#admin:}" \
            -e GF_PLUGINS_PREINSTALL_SYNC=grafana-clickhouse-datasource@4.21.3 \
            -e GF_PLUGINS_PREINSTALL=grafana-clickhouse-datasource@4.21.3 \
            -e GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false \
            -e CLICKHOUSE_USER -e CLICKHOUSE_PASSWORD \
            -v "$PWD/ci-datasources:/etc/grafana/provisioning/datasources:ro" \
            -v "$PWD/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro" \
            -v "$PWD/grafana/dashboards:/var/lib/grafana/dashboards/wetechinetmon:ro" \
            grafana/grafana:13.2.3
          for _ in $(seq 120); do
            curl -sf "$GRAFANA_URL/api/health" >/dev/null && break
            sleep 1
          done
          curl -sf "$GRAFANA_URL/api/health"
          # /api/health answers before the datasource plugins register, so
          # wait until each datasource passes its own health check.
          for uid in wnm-prometheus wnm-clickhouse; do
            for _ in $(seq 120); do
              curl -sf --user "$GRAFANA_AUTH" "$GRAFANA_URL/api/datasources/uid/$uid/health" >/dev/null && break
              sleep 1
            done
            curl -sS --fail-with-body --user "$GRAFANA_AUTH" "$GRAFANA_URL/api/datasources/uid/$uid/health"
            echo
          done
      - name: Run every panel query
        run: scripts/grafana-dashboard-live-check.sh grafana/dashboards
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs grafana 2>&1 | tail -n 100
          docker logs clickhouse 2>&1 | tail -n 50

  web:
    name: Web UI (lint, types, tests, build, audit, licences)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Exactly the lockfile, and no install scripts (R22, ADR 0044).
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint (includes the T-08 untrusted-HTML rule)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: The page has no inline script or style (the CSP forbids them)
        run: |
          if grep -qiE '<script>|<script [^>]*>[^<]|<style|style=' dist/index.html; then
            echo "dist/index.html holds inline code"; exit 1
          fi
      - name: Known vulnerabilities
        run: npm audit --audit-level=high
      - name: Licences
        run: npm run licences

  e2e:
    name: Web end-to-end (Playwright, real API and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same throwaway database as the postgres job; nothing here is a
    # secret. The stack runs on loopback only.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wetechinetmon_test
          POSTGRES_PASSWORD: wetechinetmon_test_only
          POSTGRES_DB: wetechinetmon_incident_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wetechinetmon_test -d wetechinetmon_incident_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE: "host=127.0.0.1 port=55432 user=wetechinetmon_test password=wetechinetmon_test_only dbname=wetechinetmon_incident_test"
      E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build the API and the incident manager
        run: cargo build -p wetechinetmon-api -p wetechinetmon-incident-manager
      - name: Build the UI and install the browser
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm run build
          npx playwright install --with-deps chromium
      - name: Start the stack and seed one incident
        run: |
          set -euo pipefail
          # The incident manager applies the migrations, then keeps running.
          WETECHINETMON_INCIDENT_DATABASE_URL="$DATABASE" \
            WETECHINETMON_INCIDENT_METRICS_BIND=127.0.0.1:9091 \
            target/debug/wetechinetmon-incident-manager > manager.log 2>&1 &
          for _ in $(seq 60); do
            docker exec "${{ job.services.postgres.id }}" psql -U wetechinetmon_test \
              -d wetechinetmon_incident_test -tAc "SELECT 1 FROM api_sessions LIMIT 1" \
              >/dev/null 2>&1 && break
            sleep 1
          done
          token=$(WETECHINETMON_API_DATABASE_URL="$DATABASE" target/debug/wetechinetmon-api \
            token create --tenant acme --actor-id e2e-lead --role noc_lead --days 1 \
            | awk '/^token:/ {print $2}')
          [ -n "$token" ] || { echo "no token was created"; exit 1; }
          echo "::add-mask::$token"
          echo "E2E_TOKEN=$token" >> "$GITHUB_ENV"
          WETECHINETMON_API_DATABASE_URL="$DATABASE" \
            WETECHINETMON_API_WEB_ROOT=apps/web/dist \
            target/debug/wetechinetmon-api > api.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf "$E2E_BASE_URL/readyz" >/dev/null && break
            sleep 1
          done
          curl -sS --fail-with-body "$E2E_BASE_URL/readyz"
          # One open incident whose title is hostile markup (T-08).
          curl -sS --fail-with-body -X POST "$E2E_BASE_URL/api/v1/incidents" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -H "Idempotency-Key: e2e-seed-incident-0001" \
            --data '{"title":"<img src=x onerror=\"window.__pwned=1\">Spoofed sources","severity":"major","target_scope":"host","target":"203.0.113.90","direction":"incoming"}' \
            >/dev/null
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 50 api.log manager.log || true

  docs:
    name: Docs (Markdown, YAML, links, MkDocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Markdown lint
        run: npx -y markdownlint-cli2@0.13.0 "**/*.md" "#node_modules"
      - name: Validate YAML syntax
        run: |
          set -euo pipefail
          npm install --no-save js-yaml@4
          status=0
          while IFS= read -r -d '' f; do
            node -e "require('js-yaml').load(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" \
              && echo "OK: $f" \
              || { echo "INVALID YAML: $f"; status=1; }
          done < <(find . -type f \( -name '*.yml' -o -name '*.yaml' \) -not -path './node_modules/*' -not -path './.git/*' -print0)
          exit "$status"
      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/mlc_config.json"
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Build docs (strict — fails on broken nav/links)
        run: mkdocs build --strict

  history:
    name: History (secret scan, DCO sign-off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action needs a paid licence once the repository belongs to
      # an organisation, and without one it failed before scanning
      # anything. The gitleaks binary itself is MIT-licensed and free, so
      # run it directly: pinned by version, verified against the release's
      # SHA-256, over the whole history (about a second at this size).
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
      # Dependabot's pull requests carry no sign-off, so they need an
      # exemption — but it is keyed on the pull request's author login,
      # which GitHub sets and a contributor cannot forge. It must never be
      # keyed on commit author metadata: anyone can run
      # `git config user.name 'x[bot]'` and walk straight past a check that
      # trusts the commit's own author string.
      #
      # Scope, deliberately: this runs on pull_request only. Commits pushed
      # directly to a branch are not checked (the repository has no branch
      # protection today), and a squash merge replaces the checked commits
      # with a new one — so whoever squashes must keep a Signed-off-by
      # trailer in the squash message. Merge commits are skipped by
      # --no-merges; the commits they bring in are still checked.
      #
      # always(): a failed secret scan must not hide whether the sign-offs
      # are in order, so this runs whatever the step above concluded.
      - name: DCO sign-off check
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'github-actions[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r sha; do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%h %s' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "OK:      $subject"
            else
              echo "MISSING: $subject — needs 'Signed-off-by: $author'"
              status=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA")
          if [ "$status" -ne 0 ]; then
            echo
            echo "Every commit needs a DCO sign-off matching its author — see the DCO file."
            echo "Fix the latest commit with:  git commit -s --amend"
            echo "Fix a whole branch with:     git rebase --signoff $BASE_SHA"
          fi
          exit "$status"
