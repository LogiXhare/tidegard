# Dependabot configuration for tidegard
#
# Only ecosystems with a real manifest file in the repository are
# configured.
# Each addition must have a corresponding entry validated in
# docs/dependency-license-matrix.md before being merged.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    # One PR for all action bumps instead of one per action. Six separate
    # PRs sat open through August 2026 because each needed its own CI run.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    # Minor and patch bumps travel together; major bumps stay as
    # individual PRs so a breaking change is reviewed on its own.
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # New crates always need a docs/dependency-license-matrix.md row
    # first — this only updates *versions* of already-approved crates,
    # it does not add new dependencies on its own.

  # The NOC UI (ADR 0044). Versions are exact in package.json; the web job
  # runs npm audit and the licence check on every update.
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    # A release must be two weeks old before it is proposed: most
    # malicious npm releases are found and pulled within days (R22).
    # Security updates are not delayed by this.
    cooldown:
      default-days: 14
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; a major
      # TypeScript bump waits until it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The images' base, pinned by digest in deployments/docker/Dockerfile
  # (ADR 0052). A new digest is proposed once it is two weeks old.
  - package-ecosystem: "docker"
    directory: "/deployments/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
