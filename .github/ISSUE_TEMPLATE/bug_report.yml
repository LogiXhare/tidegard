name: Bug Report
description: Report a defect in Tidegard
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Note: as of Phase 1
        no software has shipped yet — if your report concerns
        documentation or repository scaffolding rather than running
        software, that's still welcome here.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Exact steps, commands, or configuration used.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected Component
      description: e.g. collector, aggregator, CLI, docs, CI
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: Release version or commit SHA, if applicable.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, deployment method (Docker Compose / Kubernetes / bare-metal), relevant versions.
    validations:
      required: false
  - type: checkboxes
    id: security
    attributes:
      label: Security Check
      options:
        - label: This is not a security vulnerability report (see SECURITY.md for those)
          required: true
