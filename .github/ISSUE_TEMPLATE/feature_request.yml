name: Feature Request
description: Propose a new capability or enhancement for Tidegard
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before requesting a feature, please check
        [docs/roadmap.md](../../docs/roadmap.md) and
        [docs/out-of-scope.md](../../docs/out-of-scope.md) — it may
        already be planned for a specific phase, or explicitly deferred
        with a documented rationale.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've thought about.
    validations:
      required: false
  - type: checkboxes
    id: clean-room
    attributes:
      label: Clean-Room Check
      options:
        - label: This request does not ask for copying any proprietary vendor's code, schema, CLI syntax, dashboards, or documentation (see docs/clean-room-boundary.md)
          required: true
