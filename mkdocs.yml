site_name: WetechiNetMon
site_description: >-
  Independently engineered open network telemetry, DDoS detection, traffic
  analytics, and policy-controlled mitigation platform.
site_author: WeTechi Solutions
repo_name: badshashorif/wetechi-netmon
repo_url: https://github.com/badshashorif/wetechi-netmon
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Added 2026-08-30 so a future broken internal `#anchor` fragment fails
# `mkdocs build --strict` instead of only appearing as an INFO line that
# is easy to miss — this is how L2's broken incident-number anchor was
# actually found. The real MkDocs 1.6.1 config key is the nested
# `validation.links.anchors` (verified against the installed version's
# `mkdocs/config/defaults.py`), not a flat `validation.anchors`. This
# only checks internal doc-to-doc anchor links — it does not resolve or
# validate external URLs, so it cannot produce a false failure on an
# intentionally external link.
validation:
  links:
    anchors: warn

