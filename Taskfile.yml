version: "3"

# tidegard — documentation + Rust workspace tasks.
# Frontend tasks are added starting Phase 6. See docs/roadmap.md.

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  hooks:
    desc: Enable the repo Git hooks (pre-push Rust gate)
    cmds:
      - git config core.hooksPath .githooks

  validate:
    desc: Run all available validation (docs + Rust)
    deps: [lint:markdown, lint:yaml]
    cmds:
      - task: rust:fmt
      - task: rust:clippy
      - task: rust:test
      - task: rust:build

  lint:markdown:
    desc: Lint all Markdown files
    cmds:
      - npx -y markdownlint-cli2 "**/*.md" "#node_modules"

  lint:yaml:
    desc: Validate syntax of all YAML files
    cmds:
      - npx -y js-yaml mkdocs.yml
      - for f in $(find .github -type f \( -name '*.yml' -o -name '*.yaml' \)); do npx -y js-yaml "$f" > /dev/null && echo "OK: $f"; done

  rust:build:
    desc: cargo build --workspace --all-targets
    cmds:
      - cargo build --workspace --all-targets

  rust:test:
    desc: cargo test --workspace
    cmds:
      - cargo test --workspace

  rust:fmt:
    desc: cargo fmt --check
    cmds:
      - cargo fmt --check

  rust:clippy:
    desc: cargo clippy --workspace --all-targets -- -D warnings
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  docs:serve:
    desc: Serve the MkDocs Material site locally (requires Python)
    cmds:
      - mkdocs serve

  docs:build:
    desc: Build the MkDocs Material site strictly (requires Python)
    cmds:
      - mkdocs build --strict

  clean:
    desc: Remove build output
    cmds:
      - rm -rf site/ target/
