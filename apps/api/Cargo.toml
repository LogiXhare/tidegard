[package]
name = "wetechinetmon-api"
description = "WetechiNetMon incident REST API (Phase 5D): axum, RFC 9457 errors, OpenAPI from code (ADR 0037, ADR 0038)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wetechinetmon-api"
path = "src/main.rs"

[dependencies]
# ADR 0037, approved by the gate-8 probe (#58). Default features minus
# `form`, `original-uri` and `tower-log`, which the API does not use.
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "matched-path",
    "query",
    "tokio",
    "tracing",
] }
# ADR 0037: OpenAPI generated from the handlers.
utoipa = "6.0.0"
# ADR 0038: OS CSPRNG for API tokens. Already in Cargo.lock.
getrandom = "0.4.3"
# ADR 0038: SHA-256 of API tokens. Already in Cargo.lock through the
# PostgreSQL SCRAM client (licence matrix row 43).
sha2 = "0.11"
# ADR 0038 gate 3: TLS at the service off loopback. Both already in
# Cargo.lock through the PostgreSQL TLS connector (ADR 0023).
rustls.workspace = true
tokio-rustls = "0.26.4"
# ADR 0042: ClickHouse over its HTTP interface, with the client the CLI
# already uses (ADR 0040). All already in Cargo.lock.
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
# Workspace crates and existing workspace dependencies.
wetechinetmon-common = { path = "../../crates/common" }
wetechinetmon-incident = { path = "../../crates/incident" }
# The target vocabulary a manual incident names (ADR 0039).
wetechinetmon-detector = { path = "../../crates/detector" }
wetechinetmon-incident-postgres = { path = "../../crates/incident-postgres" }
# Mitigation records and the safety guard (ADR 0050). The API never
# speaks to GoBGP: the mitigator alone does.
wetechinetmon-mitigation = { path = "../../crates/mitigation" }
deadpool-postgres.workspace = true
tokio-postgres.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# `ServiceExt::oneshot` drives the router without a socket; tower is
# already in the closure through axum.
tower = { version = "0.5.3", features = ["util"] }
proptest.workspace = true
# tests/threats.rs captures log output to prove no note body is logged (T-23).
tracing-subscriber.workspace = true
# tests/traffic.rs seeds a real ClickHouse with the collector's schema.
wetechinetmon-storage = { path = "../../crates/storage" }
