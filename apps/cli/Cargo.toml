[package]
name = "tidegard-cli"
description = "tidegardctl: the incident CLI, an API client with no business logic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tidegardctl"
path = "src/main.rs"

[dependencies]
# ADR 0040: no new crates. Every one below is already in Cargo.lock.
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
tokio = { workspace = true }
tokio-rustls = "0.26.4"
rustls.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tidegard-common = { path = "../../crates/common" }
# One Idempotency-Key per logical command (ADR 0040).
uuid.workspace = true

[dev-dependencies]
# A stand-in API server for the tests: axum is already the API's framework.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
